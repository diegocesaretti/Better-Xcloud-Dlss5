name: Build Windows alpha

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout bridge
        uses: actions/checkout@v4

      - name: Fetch pinned DLSS5 Video Player source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path external -Force | Out-Null
          git clone --depth 1 --branch dlss5-video-player-v0.24.0 https://github.com/2600th/dlss5-video-player.git external/dlss5-video-player

      - name: Apply Better Xcloud GTX/Turing carrier compatibility patch
        shell: pwsh
        run: |
          $path = 'external/dlss5-video-player/src/DLSSBackend.cpp'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = "    if (!NVSDK_NGX_FAILED(availResult) && !srAvailable) {`n        LOG(`"NGX reports SuperSampling.Available=0; native DLSS SR is unavailable on this system/runtime.`");`n        return false;`n    }"
          $new = "    if (!NVSDK_NGX_FAILED(availResult) && !srAvailable) {`n        wchar_t compat[8]{};`n        const bool allowUnsupportedCarrier =`n            GetEnvironmentVariableW(`n                L`"BETTER_XCLOUD_DLSS5_ALLOW_UNSUPPORTED_SR`",`n                compat,`n                8) > 0`n            && compat[0] == L'1';`n        if (!allowUnsupportedCarrier) {`n            LOG(`"NGX reports SuperSampling.Available=0; native DLSS SR is unavailable on this system/runtime.`");`n            return false;`n        }`n        LOG(`"NGX reports SuperSampling.Available=0; continuing with the Better Xcloud experimental carrier path so the RenoDX raw-NGX hook can attempt interception.`");`n    }"
          if (-not $text.Contains($old)) {
            throw 'Pinned DLSSBackend.cpp no longer matches the expected GTX compatibility insertion point.'
          }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
      - name: Fetch pinned NVIDIA DLSS SDK
        shell: pwsh
        run: |
          git init external/DLSS
          git -C external/DLSS remote add origin https://github.com/NVIDIA/DLSS.git
          git -C external/DLSS fetch --depth 1 origin a291cc7d2cc642a51566f3dfd5376f635cd1b284
          git -C external/DLSS checkout --detach FETCH_HEAD

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'installer/Install.ps1',
            'installer/Uninstall.ps1',
            'installer/Import-CompatibilityPack.ps1',
            'launcher/Start-XCloud-DLSS5.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $($_.Message)" }
              throw "PowerShell syntax validation failed for $file"
            }
          }

      - name: Test compatibility pack importer
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'compat-test'
          $source = Join-Path $root 'source'
          $dest = Join-Path $root 'dest'
          $work = Join-Path $root 'work'
          New-Item -ItemType Directory -Path $source,$dest,$work -Force | Out-Null
          'fake pinned SF-v2 neural runtime' | Set-Content -LiteralPath (Join-Path $dest 'nvngx_dlssnr.dll') -Encoding ascii
          $pinnedHash = (Get-FileHash -LiteralPath (Join-Path $dest 'nvngx_dlssnr.dll') -Algorithm SHA256).Hash

          'fake proxy' | Set-Content -LiteralPath (Join-Path $source 'version.dll') -Encoding ascii
          'fake interposer' | Set-Content -LiteralPath (Join-Path $source 'sl.interposer.dll') -Encoding ascii
          'fake NR plugin' | Set-Content -LiteralPath (Join-Path $source 'sl.dlss_nr.dll') -Encoding ascii
          'fake DLSS runtime' | Set-Content -LiteralPath (Join-Path $source 'nvngx_dlss.dll') -Encoding ascii
          'different pack neural runtime that must NOT replace SF-v2' | Set-Content -LiteralPath (Join-Path $source 'nvngx_dlssnr.dll') -Encoding ascii
          $zip = Join-Path $root 'GTX1660-test.zip'
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $zip -Force
          $report = Join-Path $root 'report.txt'
          & ./installer/Import-CompatibilityPack.ps1 -PackPath $zip -InstalledNeural $dest -WorkRoot $work -ReportPath $report | Out-Host
          foreach ($name in @('version.dll','sl.interposer.dll','sl.dlss_nr.dll','nvngx_dlss.dll','nvngx_dlssnr.dll')) {
            if (-not (Test-Path (Join-Path $dest $name))) { throw "Importer did not leave required file $name." }
          }
          $afterHash = (Get-FileHash -LiteralPath (Join-Path $dest 'nvngx_dlssnr.dll') -Algorithm SHA256).Hash
          if ($afterHash -ne $pinnedHash) { throw 'Importer replaced the pinned universal Turing DLSSNR runtime.' }
          if (-not (Select-String -LiteralPath $report -SimpleMatch 'Compatibility mode: streamline-version-proxy' -Quiet)) { throw 'Importer report did not record the Streamline proxy route.' }
          if (-not (Select-String -LiteralPath $report -SimpleMatch 'Pinned neural runtime preserved: True' -Quiet)) { throw 'Importer report did not record preservation of the pinned neural runtime.' }

          # New OptiScaler built-in NR route: it must replace the neural runtime,
          # stage OptiScaler as winmm.dll and remove the legacy injector chain.
          $directRoot = Join-Path $env:RUNNER_TEMP 'opti-direct-test'
          $directSource = Join-Path $directRoot 'Main mod'
          $directSupport = Join-Path $directSource 'OptiScaler'
          $directDest = Join-Path $directRoot 'dest'
          $directWork = Join-Path $directRoot 'work'
          New-Item -ItemType Directory -Path $directSource,$directSupport,$directDest,$directWork -Force | Out-Null

          'legacy reshade' | Set-Content -LiteralPath (Join-Path $directDest 'dxgi.dll') -Encoding ascii
          'legacy renodx' | Set-Content -LiteralPath (Join-Path $directDest 'renodx-dlss5.addon64') -Encoding ascii
          'legacy neural runtime' | Set-Content -LiteralPath (Join-Path $directDest 'nvngx_dlssnr.dll') -Encoding ascii

          'fake optiscaler proxy' | Set-Content -LiteralPath (Join-Path $directSource 'OptiScaler.dll') -Encoding ascii
          "[DlssNr]`nEnabled=auto" | Set-Content -LiteralPath (Join-Path $directSource 'OptiScaler.ini') -Encoding ascii
          'new direct neural runtime' | Set-Content -LiteralPath (Join-Path $directSource 'nvngx_dlssnr.dll') -Encoding ascii
          'support backend' | Set-Content -LiteralPath (Join-Path $directSupport 'backend.dll') -Encoding ascii

          $directReport = Join-Path $directRoot 'report.txt'
          & ./installer/Import-CompatibilityPack.ps1 -PackPath $directRoot -InstalledNeural $directDest -WorkRoot $directWork -ReportPath $directReport | Out-Host

          if (-not (Test-Path (Join-Path $directDest 'winmm.dll'))) { throw 'Direct importer did not stage OptiScaler as winmm.dll.' }
          if (-not (Test-Path (Join-Path $directDest 'OptiScaler.ini'))) { throw 'Direct importer did not stage OptiScaler.ini.' }
          if (-not (Test-Path (Join-Path $directDest 'OptiScaler\backend.dll'))) { throw 'Direct importer did not stage OptiScaler support directory.' }
          if (Test-Path (Join-Path $directDest 'dxgi.dll')) { throw 'Direct importer left legacy ReShade proxy in place.' }
          if (Test-Path (Join-Path $directDest 'renodx-dlss5.addon64')) { throw 'Direct importer left legacy RenoDX add-on in place.' }
          if (-not (Select-String -LiteralPath $directReport -SimpleMatch 'Compatibility mode: optiscaler-direct-nr' -Quiet)) { throw 'Importer report did not record OptiScaler direct NR mode.' }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 -DDLSS5_UPSTREAM="$PWD/external/dlss5-video-player" -DDLSS_SDK="$PWD/external/DLSS"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Stage novice-friendly package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/installer,dist/launcher -Force | Out-Null
          Copy-Item build/Release/XCloudDLSS5Host.exe dist/
          Copy-Item Install.cmd,Uninstall.cmd,README.md,THIRD_PARTY_NOTICES.md dist/
          Copy-Item installer/Install.ps1,installer/Uninstall.ps1,installer/Import-CompatibilityPack.ps1 dist/installer/
          Copy-Item launcher/Start-XCloud-DLSS5.ps1 dist/launcher/
          Copy-Item docs -Destination dist/docs -Recurse

          if (-not (Test-Path dist/XCloudDLSS5Host.exe)) {
            throw 'Host executable was not staged.'
          }

      - name: Create downloadable ZIP
        shell: pwsh
        run: |
          $zip = 'Better-Xcloud-DLSS5-win64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path dist\* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -LiteralPath 'Better-Xcloud-DLSS5-win64.sha256' -Encoding ascii

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Better-Xcloud-DLSS5-win64
          path: |
            Better-Xcloud-DLSS5-win64.zip
            Better-Xcloud-DLSS5-win64.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling alpha release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view alpha-latest --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete alpha-latest --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag
          }

          $notes = @(
            'Early alpha build for real-hardware testing.',
            '',
            'Download Better-Xcloud-DLSS5-win64.zip, extract it, then double-click Install.cmd.',
            '',
            'The installer downloads the pinned DLSS5 Video Player neural runtime directly from its upstream release and verifies its SHA-256. That runtime is not redistributed here.',
            '',
            'GTX 1660 / 1660 Super support is experimental. A successful GitHub build proves that the Windows host compiles; it does not prove that Feature 18 initializes or meets real-time latency on the target GPU.'
          )
          $notes | Set-Content -LiteralPath alpha-notes.md -Encoding UTF8

          gh release create alpha-latest Better-Xcloud-DLSS5-win64.zip Better-Xcloud-DLSS5-win64.sha256 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Better Xcloud DLSS5 - rolling alpha" --notes-file alpha-notes.md --prerelease
